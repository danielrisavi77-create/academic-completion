name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate production E2E harness syntax
        run: npm run check:production-e2e

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          SUPABASE_SECRET_KEY: ci-supabase-server-credential-marker
          ANTHROPIC_API_KEY: ci-anthropic-server-credential-marker

      - name: Ensure server credentials are not embedded in Next output
        shell: bash
        env:
          SUPABASE_SECRET_KEY: ci-supabase-server-credential-marker
          ANTHROPIC_API_KEY: ci-anthropic-server-credential-marker
        run: |
          if grep -R -qF "$SUPABASE_SECRET_KEY" .next; then
            echo "Supabase server credential marker was embedded in the Next build output."
            exit 1
          fi
          if grep -R -qF "$ANTHROPIC_API_KEY" .next; then
            echo "Anthropic server credential marker was embedded in the Next build output."
            exit 1
          fi
