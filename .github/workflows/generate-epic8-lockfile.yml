name: Generate Epic 8 lockfile

on:
  push:
    branches: [agent/epic-8-auth-persistence]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/epic-8-auth-persistence

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json was not generated" >&2
            exit 1
          fi
          if git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Commit reproducible npm lockfile"
            git push origin HEAD:agent/epic-8-auth-persistence
          else
            echo "Lockfile already current."
          fi
